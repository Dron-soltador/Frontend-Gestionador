<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal del Operador - Flota de Drones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes pulse-red {
            0%, 100% { border-color: rgba(239, 68, 68, 0.8); box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
            50% { border-color: rgba(239, 68, 68, 0.3); box-shadow: 0 0 5px rgba(239, 68, 68, 0.1); }
        }
        .battery-danger { animation: pulse-red 1.8s infinite; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2.5 rounded-xl shadow-lg shadow-blue-500/20">
                    <i class="fa-solid fa-drone-front text-2xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-wide">Portal del Operador</h1>
                    <p class="text-xs text-slate-400">Gestión y control de la flota en tiempo real</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <span id="connection-status" class="inline-flex items-center px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 mr-2 animate-ping"></span>
                    Conectado (5001)
                </span>
                
                <button type="button" onclick="window.abrirModalRegistrar()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs px-4 py-2 rounded-xl transition-all shadow-lg shadow-blue-600/30 flex items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-plus"></i> Registrar Dron
                </button>

                <button type="button" onclick="window.cargarDrones()" class="p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded-xl transition-colors">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Summary Stats -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-slate-800/80 border border-slate-700 p-5 rounded-xl">
                <div class="text-xs font-semibold uppercase text-slate-400">Total Flota</div>
                <div class="text-3xl font-extrabold text-white mt-1" id="stat-total">0</div>
            </div>
            <div class="bg-slate-800/80 border border-slate-700 p-5 rounded-xl">
                <div class="text-xs font-semibold uppercase text-emerald-400">Disponibles</div>
                <div class="text-3xl font-extrabold text-emerald-400 mt-1" id="stat-disponibles">0</div>
            </div>
            <div class="bg-slate-800/80 border border-slate-700 p-5 rounded-xl">
                <div class="text-xs font-semibold uppercase text-amber-400">En Misión / Cargando</div>
                <div class="text-3xl font-extrabold text-amber-400 mt-1" id="stat-mision">0</div>
            </div>
            <div class="bg-slate-800/80 border border-slate-700 p-5 rounded-xl">
                <div class="text-xs font-semibold uppercase text-rose-400">Alerta Batería (&lt;20%)</div>
                <div class="text-3xl font-extrabold text-rose-400 mt-1" id="stat-alerta">0</div>
            </div>
        </div>

        <!-- Filtros -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
            <h2 class="text-lg font-bold text-slate-200">Unidades de la Flota</h2>
            <div class="flex flex-wrap gap-2">
                <button type="button" onclick="window.filtrarDrones('TODOS', this)" class="filtro-btn active px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white">Todos</button>
                <button type="button" onclick="window.filtrarDrones('DISPONIBLE', this)" class="filtro-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">Disponibles</button>
                <button type="button" onclick="window.filtrarDrones('EN_MISION', this)" class="filtro-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">En Misión</button>
                <button type="button" onclick="window.filtrarDrones('CARGANDO', this)" class="filtro-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">Cargando</button>
                <button type="button" onclick="window.filtrarDrones('CRITICO', this)" class="filtro-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">Críticos / Mantenimiento</button>
            </div>
        </div>

        <!-- Grid -->
        <div id="drones-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- MODAL 1: Registrar Dron -->
    <div id="modal-registrar" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-blue-500"></i> Registrar Nuevo Dron
                </h3>
                <button type="button" onclick="window.cerrarModalRegistrar()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <form id="form-registrar" onsubmit="window.guardarNuevoDron(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Modelo del Dron</label>
                    <input type="text" id="reg-modelo" placeholder="Ej: DJI Matrice 350 RTK" required
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Capacidad Máxima (kg)</label>
                    <input type="number" step="0.1" id="reg-capacidad" placeholder="Ej: 5.5" required
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Batería Inicial (%)</label>
                        <input type="number" id="reg-bateria" min="0" max="100" value="100" required
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Estado Inicial</label>
                        <select id="reg-estado" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                            <option value="DISPONIBLE">DISPONIBLE</option>
                            <option value="CARGANDO">CARGANDO</option>
                            <option value="MANTENIMIENTO">MANTENIMIENTO</option>
                        </select>
                    </div>
                </div>

                <div class="pt-4 flex justify-end gap-3">
                    <button type="button" onclick="window.cerrarModalRegistrar()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs font-semibold">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-xl text-xs font-semibold text-white cursor-pointer">Guardar Dron</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL 2: Telemetría / Recarga -->
    <div id="modal-telemetria" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-amber-400"></i> Ajustar Telemetría / Recarga
                </h3>
                <button type="button" onclick="window.cerrarModalTelemetria()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <form id="form-telemetria" onsubmit="window.guardarTelemetria(event)" class="space-y-4">
                <input type="hidden" id="tele-id">

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Dron Seleccionado</label>
                    <p id="tele-modelo-nombre" class="text-sm font-bold text-blue-400 bg-slate-900/80 p-2.5 rounded-xl border border-slate-700"></p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Nivel de Batería (%): <span id="tele-bateria-val" class="text-white font-bold">100%</span></label>
                    <input type="range" id="tele-bateria" min="0" max="100" class="w-full accent-blue-500 cursor-pointer" oninput="document.getElementById('tele-bateria-val').innerText = this.value + '%'">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Estado Operacional</label>
                    <select id="tele-estado" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                        <option value="DISPONIBLE">DISPONIBLE</option>
                        <option value="CARGANDO">CARGANDO (Forzar Recarga)</option>
                        <option value="EN_MISION">EN_MISION</option>
                        <option value="MANTENIMIENTO">MANTENIMIENTO</option>
                        <option value="SIN_BATERIA">SIN_BATERIA</option>
                    </select>
                </div>

                <button type="button" onclick="window.quickRecargarBateria(event)" class="w-full bg-amber-500/10 border border-amber-500/30 hover:bg-amber-500/20 text-amber-400 font-semibold text-xs py-2.5 rounded-xl transition-all flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-bolt"></i> Simular Recarga Completa (100% Batería + CARGANDO)
                </button>

                <div class="pt-2 flex justify-end gap-3">
                    <button type="button" onclick="window.cerrarModalTelemetria()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs font-semibold">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl text-xs font-semibold text-white cursor-pointer">Actualizar Telemetría</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
